services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: marin-pdf-web:dev
    container_name: marin-pdf-web
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
      # .git を匿名ボリュームでマスクし、コンテナから見えなくする。
      # これがないと git pull/commit で .git/objects/* (バイナリ) が書き込まれた際、
      # Vite (ポーリング監視) がそれを JS としてパースしようとしてオーバーレイエラーを出す。
      - /app/.git
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped
