services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: marin-pdf-web:dev
    container_name: marin-pdf-web
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped
